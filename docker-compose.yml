# Two containers from one image. Secrets come from .env (interpolated below); each container gets only
# the variables it needs. Config lives in ./config/config.yaml (edited by the web UI); data in a volume.
services:
  sherpa:
    build:
      context: .
      args:
        SHERPA_REV: ${SHERPA_REV:-}
    image: sherpa:local
    container_name: sherpa
    hostname: sherpa              # appears in every Telegram message
    restart: always               # comes back after reboots even if it was stopped by hand before
    stop_grace_period: 30s        # lets an in-flight activation and the alert queue finish
    environment:
      TZ: ${TZ:-Europe/Ljubljana}
      SHERPA_TELEGRAM_TOKEN: ${SHERPA_TELEGRAM_TOKEN:-}
      SHERPA_TELEGRAM_CHAT_ID: ${SHERPA_TELEGRAM_CHAT_ID:-}
      SHERPA_DEADMAN_URL: ${SHERPA_DEADMAN_URL:-}
    volumes:
      - type: bind                # the directory, not the file: the web UI replaces config.yaml atomically
        source: ./config
        target: /config
        read_only: true
        bind: {create_host_path: false}   # fail loudly if ./config is missing (Docker would create it root-owned)
      - sherpa-data:/data         # SQLite dedupe DB, status, last-good config: must persist across restarts
    healthcheck:
      test: ["CMD", "sherpa", "healthcheck", "--file", "/data/health", "--max-age", "30"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  web:
    # Dashboard, history, settings and maintenance tools. Separate process: it cannot disturb the poll loop.
    image: sherpa:local
    container_name: sherpa-web
    hostname: sherpa-web
    restart: always
    command: ["web", "-c", "/config/config.yaml", "--fallback", "/data/config.last-good.yaml", "--port", "8080"]
    environment:
      TZ: ${TZ:-Europe/Ljubljana}
      SHERPA_WEB_PASSWORD: ${SHERPA_WEB_PASSWORD:-}   # empty = read-only
    ports:
      # Plain HTTP: keep it on the LAN. Set SHERPA_WEB_BIND to the VM's LAN IP to listen on that interface only
      # (Docker-published ports bypass ufw).
      - "${SHERPA_WEB_BIND:-0.0.0.0}:${SHERPA_WEB_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ./config
        target: /config
        bind: {create_host_path: false}
      - sherpa-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The UI shares the VM with the poller: whatever happens to it must not starve the service.
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  sherpa-data:
    name: sherpa_sherpa-data      # fixed name, whatever the folder is called; never use `docker compose down -v`
