[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sherpa"
dynamic = ["version"]  # single source: sherpa.__version__
description = "Smart Home Emergency Response Platform for Alerting"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "PyYAML>=6,<7",
  "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sherpa = "sherpa.cli:main"

[tool.setuptools.dynamic]
version = {attr = "sherpa.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
