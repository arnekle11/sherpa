[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sherpa"
version = "0.1.0"
description = "Smart Home Emergency Response Platform for Alerting"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "lxml>=5",
  "PyYAML>=6",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sherpa = "sherpa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
